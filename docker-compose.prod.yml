name: alive-prod

x-backend: &backend
  platform: ${DEPLOY_PLATFORM:-linux/amd64}
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: alive-backend:${BACKEND_IMAGE_TAG:-latest}
  env_file:
    - ${PROD_ENV_FILE:-.env.prod}
  volumes:
    - type: bind
      source: ${TOSS_MTLS_SECRETS_DIR:-./secrets/toss}
      target: /run/secrets/toss
      read_only: true
    - type: bind
      source: ${GOOGLE_PLAY_SECRETS_DIR:-./secrets/google-play}
      target: /run/secrets/google-play
      read_only: true
    - type: bind
      source: ${APP_STORE_SECRETS_DIR:-./secrets/app-store}
      target: /run/secrets/app-store
      read_only: true
  networks:
    - levelup-net

services:
  db-bootstrap:
    platform: ${DEPLOY_PLATFORM:-linux/amd64}
    image: postgres:16-alpine
    profiles:
      - db-bootstrap
    restart: "no"
    env_file:
      - ${DB_BOOTSTRAP_ENV_FILE:-.env.db-bootstrap}
    networks:
      - levelup-net
    command:
      - /bin/sh
      - -ec
      - |
        : "$${PGHOST:?PGHOST is required}"
        : "$${PGUSER:?PGUSER is required}"
        : "$${PGPASSWORD:?PGPASSWORD is required}"
        : "$${APP_DB_NAME:?APP_DB_NAME is required}"
        : "$${APP_DB_USER:?APP_DB_USER is required}"
        : "$${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}"
        psql --set=ON_ERROR_STOP=1 \
          --set=app_db="$${APP_DB_NAME}" \
          --set=app_user="$${APP_DB_USER}" \
          --set=app_password="$${APP_DB_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user')
        \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db')
        \gexec
        SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'app_db', :'app_user')
        \gexec
        SQL
        psql --dbname="$${APP_DB_NAME}" \
          --set=ON_ERROR_STOP=1 \
          --set=app_user="$${APP_DB_USER}" <<'SQL'
        SELECT format('GRANT ALL ON SCHEMA public TO %I', :'app_user')
        \gexec
        SQL

  migrate:
    <<: *backend
    restart: "no"
    networks:
      - levelup-net
    command:
      - alembic
      - upgrade
      - head

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8888}:8888"
    networks:
    - levelup-net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8888/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  levelup-net:
    external: true
    name: levelup-net
