x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://instarchat:instarchat@db:5432/instarchat
    AUTO_POST_SCHEDULER_ENABLED: "true"
    ACCOUNT_DELETION_SCHEDULER_ENABLED: "false"
  volumes:
    - ./backend:/app
  networks:
    - instarchat-local-net

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: instarchat-local-db
    ports:
      - "${DB_PORT:-7555}:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    networks:
      - instarchat-local-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instarchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    container_name: instarchat-local-migrate
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$(alembic current 2>/dev/null)" ]; then
          alembic stamp 20260626_0001
        fi
        alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    container_name: instarchat-local-backend
    command:
      - uvicorn
      - app.main:app
      - --reload
      - --host
      - 0.0.0.0
      - --port
      - "8888"
    ports:
      - "${BACKEND_PORT:-8000}:8888"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8888/health", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data_local:

networks:
  instarchat-local-net:
    driver: bridge
